<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Paysage de dark fantasy avec citadelle, montagnes et brume">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#090b10"/>
      <stop offset=".48" stop-color="#111216"/>
      <stop offset="1" stop-color="#050607"/>
    </linearGradient>
    <radialGradient id="moon" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#d9cfb8" stop-opacity=".88"/>
      <stop offset=".58" stop-color="#a69b86" stop-opacity=".42"/>
      <stop offset="1" stop-color="#8c2c27" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lava" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#42100f"/>
      <stop offset=".45" stop-color="#9f2f28"/>
      <stop offset=".7" stop-color="#d05d42"/>
      <stop offset="1" stop-color="#42100f"/>
    </linearGradient>
    <linearGradient id="fog" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b9b0a1" stop-opacity=".01"/>
      <stop offset="1" stop-color="#b9b0a1" stop-opacity=".18"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>
  <circle cx="1260" cy="178" r="190" fill="url(#moon)"/>
  <circle cx="1260" cy="178" r="70" fill="#b7ad9a" opacity=".13"/>

  <g opacity=".2" fill="#0e1014">
    <path d="M0 430L120 298l102 81 130-176 147 167 104-112 142 151 94-118 122 139 115-108 118 95 130-145 147 158 129-82 110 91v250H0z"/>
  </g>
  <g opacity=".52" fill="#090a0c">
    <path d="M0 548l177-139 108 91 108-156 106 112 144-190 149 199 137-117 103 118 125-170 134 168 114-94 195 162v212H0z"/>
  </g>

  <!-- Citadel -->
  <g transform="translate(145 175)" fill="#070809" stroke="#242126" stroke-width="2" opacity=".95">
    <path d="M28 345h410v230H28z"/>
    <path d="M84 224h78v351H84zM212 166h82v409h-82zM342 244h66v331h-66z"/>
    <path d="M74 224l49-87 49 87zM201 166l52-116 52 116zM333 244l42-79 42 79z"/>
    <path d="M174 315h163v260H174z"/>
    <path d="M195 315l60-96 61 96z"/>
    <g fill="#9d3229" opacity=".48" stroke="none">
      <rect x="112" y="294" width="17" height="47" rx="8"/>
      <rect x="244" y="239" width="18" height="59" rx="9"/>
      <rect x="366" y="307" width="14" height="44" rx="7"/>
      <rect x="232" y="371" width="18" height="50" rx="9"/>
      <rect x="275" y="371" width="18" height="50" rx="9"/>
    </g>
    <g stroke="#171518" stroke-width="8">
      <path d="M64 345v-62m38 62v-78m38 78v-52m258 52v-66m-35 66v-80"/>
    </g>
  </g>

  <!-- Dragon silhouette, intentionally abstract/original -->
  <g transform="translate(1125 85)" fill="#08090b" stroke="#242229" stroke-width="3" opacity=".86">
    <path d="M72 170c48-67 104-73 165-52 33 11 75 13 110-22-16 49-53 72-103 75 35 15 55 41 60 80-32-27-70-36-111-25-22 6-43 14-68 7-38-10-64-36-78-78 9 11 17 17 25 15z"/>
    <path d="M105 152c-44-17-76-48-96-92 49 15 86 40 115 74z"/>
    <path d="M213 137c43-48 92-78 150-91-24 52-57 88-104 110z"/>
    <path d="M43 144l-33 10 28 17-16 31 38-20"/>
    <circle cx="47" cy="143" r="4" fill="#c33b2f" stroke="none"/>
  </g>

  <!-- Cracks / ember valley -->
  <path d="M915 612c98-24 176-29 264-17 97 14 182 4 307-39" fill="none" stroke="url(#lava)" stroke-width="6" opacity=".25" filter="url(#soft)"/>
  <path d="M918 614c94-22 180-25 260-15 105 14 186 0 315-46" fill="none" stroke="#b63a2e" stroke-width="2" opacity=".44"/>

  <!-- Fog -->
  <g opacity=".72" filter="url(#soft)">
    <ellipse cx="410" cy="700" rx="410" ry="82" fill="#a59d90" opacity=".10"/>
    <ellipse cx="1060" cy="745" rx="560" ry="110" fill="#a59d90" opacity=".08"/>
  </g>
  <path d="M0 690c240-65 396 34 620-1 226-35 357-42 543 12 168 49 287 19 437-13v212H0z" fill="url(#fog)" opacity=".48"/>

  <!-- Embers -->
  <g fill="#be4737" opacity=".48">
    <circle cx="1022" cy="328" r="2"/><circle cx="1098" cy="392" r="1.6"/><circle cx="1344" cy="452" r="2.2"/>
    <circle cx="1218" cy="502" r="1.4"/><circle cx="1465" cy="344" r="1.8"/><circle cx="872" cy="414" r="1.5"/>
    <circle cx="1530" cy="581" r="1.4"/><circle cx="971" cy="561" r="1.8"/><circle cx="1285" cy="314" r="1.3"/>
  </g>

  <rect width="1600" height="900" fill="none" stroke="#000" stroke-width="70" opacity=".20"/>
</svg>
